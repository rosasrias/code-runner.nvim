name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Versión de Neovim
        run: nvim --version

      - name: Suite de tests
        run: nvim --headless -u NONE -l tests/run.lua

      - name: Comprobar que el working tree queda limpio
        run: git status --porcelain